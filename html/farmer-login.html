<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Farmer Login | TaniMart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Nunito+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v5.6.3/css/all.css"
    />
    <style>
      :root {
        --forest: #163a24;
        --leaf: #2e7d45;
        --leaf-dark: #22633a;
        --marigold: #f4b72f;
        --paper: #f2f6ec;
        --ink: #1b2a1f;
        --muted: #667467;
        --line: #d5dfcb;
        --danger: #c0392b;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Nunito Sans", system-ui, sans-serif;
        color: var(--ink);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background:
          radial-gradient(circle at 12% 18%, #dcebc4 0, transparent 38%),
          radial-gradient(circle at 90% 85%, #f9e7b4 0, transparent 34%),
          var(--paper);
      }
      h1 {
        font-family: "Bricolage Grotesque", "Nunito Sans", sans-serif;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.1;
      }
      a:focus-visible,
      button:focus-visible,
      input:focus-visible {
        outline: 3px solid var(--marigold);
        outline-offset: 2px;
      }

      .container {
        width: 440px;
        max-width: 100%;
        overflow: hidden;
        border-radius: 28px;
        background: #fff;
        box-shadow: 0 30px 60px -25px rgba(22, 58, 36, 0.45);
      }

      /* Header with sun and hills */
      .top {
        position: relative;
        overflow: hidden;
        height: 150px;
        background: var(--forest);
        color: #fff;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 40px 24px;
      }
      .top::before {
        content: "";
        position: absolute;
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: var(--marigold);
        top: -70px;
        right: 28px;
      }
      .top::after {
        content: "";
        position: absolute;
        left: -10%;
        right: -10%;
        bottom: -90px;
        height: 130px;
        border-radius: 50% 50% 0 0;
        background: var(--leaf);
        box-shadow: 0 -22px 0 -8px #3b9455;
      }
      .brand-mark {
        position: relative;
        z-index: 2;
        flex: none;
        width: 46px;
        height: 46px;
        border-radius: 14px 14px 14px 5px;
        background: var(--leaf);
        border: 2px solid rgba(255, 255, 255, 0.35);
        display: grid;
        place-items: center;
        font-size: 20px;
      }
      .top h1 {
        position: relative;
        z-index: 2;
        font-size: 28px;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 28px 40px 36px;
      }
      .hint {
        color: var(--muted);
        font-size: 14px;
        margin-bottom: 10px;
      }

      .pp {
        font-size: 14px;
        font-weight: 700;
        margin-top: 8px;
      }
      .field {
        position: relative;
      }
      input {
        width: 100%;
        padding: 13px 16px;
        font: inherit;
        font-size: 15px;
        color: var(--ink);
        background: var(--paper);
        border: 1.5px solid transparent;
        border-radius: 12px;
        outline: none;
        transition:
          border-color 0.2s,
          background 0.2s,
          box-shadow 0.2s;
      }
      input::placeholder {
        color: #8a978a;
      }
      input:focus {
        background: #fff;
        border-color: var(--leaf);
        box-shadow: 0 0 0 4px rgba(46, 125, 69, 0.15);
      }
      .field input[type="password"],
      .field input#password {
        padding-right: 48px;
      }
      .eye {
        position: absolute;
        right: 6px;
        top: 50%;
        transform: translateY(-50%);
        width: 38px;
        height: 38px;
        border: 0;
        border-radius: 10px;
        background: none;
        color: var(--muted);
        font-size: 15px;
        cursor: pointer;
      }
      .eye:hover {
        color: var(--forest);
      }

      button[type="submit"] {
        margin-top: 18px;
        padding: 14px 28px;
        font: inherit;
        font-weight: 700;
        font-size: 15px;
        color: #fff;
        background: var(--leaf);
        border: 0;
        border-radius: 12px;
        cursor: pointer;
        box-shadow: 0 8px 18px -8px rgba(46, 125, 69, 0.8);
        transition:
          transform 0.15s,
          background 0.2s;
      }
      button[type="submit"]:hover {
        background: var(--leaf-dark);
      }
      button[type="submit"]:active {
        transform: scale(0.98);
      }

      #error {
        color: var(--danger);
        font-size: 14px;
        min-height: 20px;
        margin-top: 4px;
      }

      .back {
        font-size: 14px;
        color: var(--muted);
        text-decoration: none;
        margin-top: 4px;
      }
      .back:hover {
        color: var(--forest);
      }

      .social-container {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 14px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
      }
      .social-container span {
        font-size: 13px;
        color: var(--muted);
        margin-right: 4px;
      }
      .social {
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        border: 1.5px solid var(--line);
        color: var(--forest);
        text-decoration: none;
        font-size: 15px;
        transition:
          background 0.2s,
          color 0.2s,
          border-color 0.2s;
      }
      .social:hover {
        background: var(--forest);
        color: #fff;
        border-color: var(--forest);
      }

      @media (max-width: 480px) {
        .top {
          padding: 0 24px 24px;
        }
        form {
          padding: 24px 24px 30px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="top">
        <div class="brand-mark"><i class="fas fa-tractor"></i></div>
        <h1>Masuk Petani</h1>
      </div>

      <form action="../php/farmlogg.php" id="login_form" method="POST">
        <p class="hint">Masuk untuk mengelola produk dan pesanan Anda.</p>

        <label class="pp" for="username">Alamat email</label>
        <input
          type="email"
          placeholder="nama@contoh.com"
          id="username"
          name="email"
          autocomplete="email"
          required
        />

        <label class="pp" for="password">Kata sandi</label>
        <div class="field">
          <input
            type="password"
            placeholder="Masukkan kata sandi"
            id="password"
            name="password"
            autocomplete="current-password"
            required
          />
          <button
            type="button"
            class="eye"
            id="togglePass"
            aria-label="Tampilkan kata sandi"
          >
            <i class="fas fa-eye"></i>
          </button>
        </div>

        <button type="submit" name="submit">Masuk</button>
        <p id="error" role="alert" aria-live="polite"></p>
        <a class="back" href="../html/index.html"
          ><i class="fas fa-arrow-left"></i>&nbsp; Kembali ke beranda</a
        >

        <div class="social-container">
          <span>Ikuti kami</span>
          <a
            href="https://www.facebook.com"
            class="social"
            id="fb"
            aria-label="Facebook"
            target="_blank"
            rel="noopener"
            ><i class="fab fa-facebook-f"></i
          ></a>
          <a
            href="https://www.instagram.com"
            class="social"
            id="ins"
            aria-label="Instagram"
            target="_blank"
            rel="noopener"
            ><i class="fab fa-instagram"></i
          ></a>
          <a
            href="https://www.gmail.com"
            class="social"
            id="gm"
            aria-label="Email"
            target="_blank"
            rel="noopener"
            ><i class="fas fa-envelope"></i
          ></a>
          <a
            href="https://www.twitter.com"
            class="social"
            id="tw"
            aria-label="Twitter"
            target="_blank"
            rel="noopener"
            ><i class="fab fa-twitter"></i
          ></a>
        </div>
      </form>
    </div>

    <script>
      const pass = document.getElementById("password");
      const toggle = document.getElementById("togglePass");
      const error = document.getElementById("error");
      if (new URLSearchParams(window.location.search).get("error") === "invalid_credentials") {
        error.textContent = "Email atau kata sandi salah.";
      }

      toggle.addEventListener("click", () => {
        const show = pass.type === "password";
        pass.type = show ? "text" : "password";
        toggle.setAttribute(
          "aria-label",
          show ? "Hide password" : "Show password",
        );
        toggle.firstElementChild.className = show
          ? "fas fa-eye-slash"
          : "fas fa-eye";
      });
    </script>
  </body>
</html>
